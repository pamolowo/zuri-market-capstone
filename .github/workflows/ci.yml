name: ci

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: ${{ matrix.app }} - lint, test, quality gate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [backend, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test --if-present
      - run: npm run build --if-present
      - name: Dependency audit (fails on high or critical)
        run: npm audit --omit=dev --audit-level=high
      - name: SonarQube Cloud scan and quality gate
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: ${{ matrix.app }}
          args: -Dsonar.qualitygate.wait=true

  image-scan:
    name: ${{ matrix.app }} - build and Trivy scan
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: backend
            build_args: ""
          - app: frontend
            build_args: "VITE_API_URL="
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (local only, not pushed)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.app }}
          build-args: ${{ matrix.build_args }}
          load: true
          push: false
          tags: scan-me:${{ matrix.app }}-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max
      - name: Trivy scan (fails on CRITICAL or HIGH)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # TODO: add the verified trivy-action version
        with:
          image-ref: scan-me:${{ matrix.app }}-${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"